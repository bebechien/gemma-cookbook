version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
    nodejs: "22"

  commands:
    - pip install -r docs/requirements.txt
    - cd docs && jupyter-book build --html .
    - mkdir -p $READTHEDOCS_OUTPUT/html/
    - cp -r docs/_build/html/* $READTHEDOCS_OUTPUT/html/

