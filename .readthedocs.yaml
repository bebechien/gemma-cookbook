version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
    nodejs: "22"
  jobs:
    build:
      html:
        - "cd docs && jupyter book build --html ."

sphinx:
  # Path to your Sphinx configuration file.
  configuration: docs/conf.py

python:
   install:
   - requirements: docs/requirements.txt
#   - method: pip
#     path: .

formats:
  - pdf
  - epub
